  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f0f2f5; }

    header {
      background: #1a73e8;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
      position: relative;
    }
    header .icon { font-size: 28px; }
    header h1 { font-size: 20px; font-weight: 700; }
    header span { font-size: 13px; opacity: 0.85; margin-left: 8px; }

    #container {
      display: flex;
      height: calc(100vh - 60px);
    }

    #sidebar {
      width: 320px;
      background: white;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      z-index: 5;
      display: flex;
      flex-direction: column;
    }

    #search-box {
      padding: 12px;
      border-bottom: 1px solid #e8e8e8;
      position: sticky;
      top: 0;
      background: white;
      z-index: 1;
    }
    #search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
    }
    #search-box input:focus { border-color: #1a73e8; }

    #count-label {
      padding: 8px 14px;
      font-size: 12px;
      color: #888;
      border-bottom: 1px solid #f0f0f0;
    }

    #list { flex: 1; }

    .item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }
    .item:hover { background: #f5f8ff; }
    .item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      margin-bottom: 4px;
    }
    .item-addr {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .item-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 500;
    }
    .badge.public { background: #e8f5e9; color: #2e7d32; }
    .badge.open { background: #fff3e0; color: #e65100; }
    .badge.cctv { background: #fce4ec; color: #c62828; }

    #map { flex: 1; }

    /* 인포윈도우 */
    .info-wrap {
      padding: 14px 16px;
      min-width: 240px;
      max-width: 300px;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .info-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .info-row {
      display: flex;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 5px;
      line-height: 1.5;
    }
    .info-label {
      color: #888;
      white-space: nowrap;
      min-width: 56px;
    }
    .info-val { color: #333; }
    .info-badges { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  </style>
</head>
<body>

    type: "개방화장실",
    manager: "서울시설공단 주차시설운영처",

  {

    addr: "서울특별시 종로구 율곡로 지하 308",
    type: "개방화장실",
    manager: "서울시시설관리공단",
    phone: "222906545",
    hours: "정시",
    hoursDetail: "06:00~24:00",
    maleToilet: 3, maleUrinal: 5,
    femaleToilet: 8,
    cctv: "Y",
    babyChange: "N",
    lat: 37.57616, lng: 126.99479
  }
];

// 지도 초기화
const map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.575, 126.985),
  zoom: 14,
  mapTypeControl: true
});

let infoWindow = null;
let markers = [];
let activeItem = null;

// 마커 아이콘 SVG 생성
function makeIcon(type, active) {
  const color = type === '공중화장실' ? (active ? '#0d47a1' : '#1a73e8')
                                      : (active ? '#b71c1c' : '#e53935');
  const size = active ? 36 : 30;
  return {
    content: `<div style="
      width:${size}px;height:${size}px;
      background:${color};
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid white;
      box-shadow:0 2px 6px rgba(0,0,0,0.35);
      display:flex;align-items:center;justify-content:center;
    "><span style="transform:rotate(45deg);font-size:${active?16:13}px;">🚻</span></div>`,
    size: new naver.maps.Size(size, size),
    anchor: new naver.maps.Point(size / 2, size)
  };
}

function buildInfoContent(d) {
  const badges = [];
  if (d.type === '공중화장실') badges.push(`<span style="background:#e8f0fe;color:#1565c0;padding:2px 8px;border-radius:10px;font-size:11px;">공중화장실</span>`);
  else badges.push(`<span style="background:#fce4ec;color:#c62828;padding:2px 8px;border-radius:10px;font-size:11px;">개방화장실</span>`);
  if (d.cctv === 'Y') badges.push(`<span style="background:#fce4ec;color:#b71c1c;padding:2px 8px;border-radius:10px;font-size:11px;">📷 CCTV</span>`);
  if (d.babyChange === 'Y') badges.push(`<span style="background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:10px;font-size:11px;">👶 기저귀교환대</span>`);

  return `<div class="info-wrap">
    <div class="info-title">🚻 ${d.name}</div>
    <div class="info-row"><span class="info-label">📍 주소</span><span class="info-val">${d.addr}</span></div>
    <div class="info-row"><span class="info-label">🕐 운영</span><span class="info-val">${d.hours}${d.hoursDetail ? ' · ' + d.hoursDetail : ''}</span></div>
    <div class="info-row"><span class="info-label">🏢 관리</span><span class="info-val">${d.manager}</span></div>
    ${d.phone ? `<div class="info-row"><span class="info-label">📞 전화</span><span class="info-val">${d.phone}</span></div>` : ''}
    <div class="info-row"><span class="info-label">🚹 남성</span><span class="info-val">대변기 ${d.maleToilet}개 · 소변기 ${d.maleUrinal}개</span></div>
    <div class="info-row"><span class="info-label">🚺 여성</span><span class="info-val">대변기 ${d.femaleToilet}개</span></div>
    <div class="info-badges">${badges.join('')}</div>
  </div>`;
}

function openInfo(marker, d, index) {
  if (infoWindow) infoWindow.close();
  if (activeItem !== null) {
    document.querySelectorAll('.item')[activeItem]?.classList.remove('active');
    markers[activeItem].setIcon(makeIcon(data[activeItem].type, false));
  }
  activeItem = index;
  marker.setIcon(makeIcon(d.type, true));

  infoWindow = new naver.maps.InfoWindow({
    content: buildInfoContent(d),
    borderWidth: 0,
    disableAnchor: false,
    backgroundColor: 'white',
    borderColor: 'transparent',
    pixelOffset: new naver.maps.Point(0, -10)
  });
  infoWindow.open(map, marker);
  map.panTo(new naver.maps.LatLng(d.lat, d.lng));

  // 사이드바 활성화
  const items = document.querySelectorAll('.item');
  items.forEach(el => el.classList.remove('active'));
  items[index]?.classList.add('active');
  items[index]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// 마커 생성
data.forEach((d, i) => {
  const marker = new naver.maps.Marker({
    position: new naver.maps.LatLng(d.lat, d.lng),
    map,
    icon: makeIcon(d.type, false),
    title: d.name
  });
  markers.push(marker);

  naver.maps.Event.addListener(marker, 'click', () => openInfo(marker, d, i));
});

// 사이드바 목록 렌더링
function renderList(filtered) {
  const list = document.getElementById('list');
  const countLabel = document.getElementById('count-label');
  countLabel.textContent = `총 ${filtered.length}개 화장실`;
  list.innerHTML = '';

  filtered.forEach(({ d, i }) => {
    const el = document.createElement('div');
    el.className = 'item';
    const badges = [];
    if (d.type === '공중화장실') badges.push(`<span class="badge public">공중</span>`);
    else badges.push(`<span class="badge open">개방</span>`);
    if (d.hours === '상시') badges.push(`<span class="badge">24시간</span>`);
    if (d.cctv === 'Y') badges.push(`<span class="badge cctv">CCTV</span>`);
    if (d.babyChange === 'Y') badges.push(`<span class="badge">기저귀교환대</span>`);

    el.innerHTML = `
      <div class="item-title">${d.name}</div>
      <div class="item-addr">${d.addr}</div>
      <div class="item-badges">${badges.join('')}</div>
    `;
    el.addEventListener('click', () => openInfo(markers[i], d, i));
    list.appendChild(el);
  });
}

const allItems = data.map((d, i) => ({ d, i }));
renderList(allItems);

// 검색
document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = allItems.filter(({ d }) =>
    d.name.toLowerCase().includes(q) || d.addr.toLowerCase().includes(q)
  );
  // 마커 가시성
  data.forEach((_, i) => {
    const show = filtered.some(f => f.i === i);
    markers[i].setMap(show ? map : null);
  });
  renderList(filtered);
  if (infoWindow) { infoWindow.close(); activeItem = null; }
});

// 지도 클릭시 인포윈도우 닫기
naver.maps.Event.addListener(map, 'click', () => {
  if (infoWindow) infoWindow.close();
  if (activeItem !== null) {
    markers[activeItem].setIcon(makeIcon(data[activeItem].type, false));
    document.querySelectorAll('.item')[activeItem]?.classList.remove('active');
    activeItem = null;
  }
});
</script>
