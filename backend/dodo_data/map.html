<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서울 공중화장실</title>
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=cvsssp59a5"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, 'Malgun Gothic', sans-serif; background: #000; }

    /* ── 지도: 항상 전체화면 ── */
    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── 상단 검색바 ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 30;
      padding: 12px 12px 0;
      pointer-events: none;
    }
    #search-box {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border-radius: 16px;
      padding: 0 14px 0 16px;
      height: 52px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    #search-box .logo { font-size: 22px; flex-shrink: 0; }
    #search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      color: #222;
      background: transparent;
      min-width: 0;
    }
    #search-input::placeholder { color: #aaa; }
    #clear-btn {
      width: 28px; height: 28px;
      border-radius: 50%; border: none;
      background: #e0e0e0; color: #555;
      font-size: 13px; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #clear-btn.visible { display: flex; }

    /* 자동완성 */
    #autocomplete {
      pointer-events: all;
      margin-top: 4px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      overflow: hidden;
      display: none;
    }
    #autocomplete.show { display: block; }
    .ac-item {
      padding: 13px 18px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
      display: flex; flex-direction: column; gap: 3px;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:active { background: #f0fdf6; }
    .ac-name { font-size: 14px; font-weight: 600; color: #222; }
    .ac-name mark { background: none; color: #03c75a; font-weight: 700; }
    .ac-addr { font-size: 12px; color: #999; }

    /* ── FAB 버튼들 (우측) ── */
    #fabs {
      position: fixed;
      right: 16px;
      bottom: 230px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fab {
      width: 50px; height: 50px;
      border-radius: 50%;
      border: none;
      background: white;
      box-shadow: 0 3px 14px rgba(0,0,0,0.22);
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .fab:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    #locate-btn.loading { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

    /* ── 경로 취소 FAB ── */
    #route-cancel-fab {
      position: fixed;
      top: 76px; right: 12px;
      z-index: 30;
      display: none;
      align-items: center; gap: 6px;
      background: #e53935; color: white;
      border: none; border-radius: 22px;
      padding: 11px 16px;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 3px 12px rgba(229,57,53,0.4);
      cursor: pointer;
    }
    #route-cancel-fab.show { display: flex; }

    /* ── Bottom Sheet ── */
    #sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 20;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.14);
      display: flex;
      flex-direction: column;
      transition: height 0.35s cubic-bezier(0.4,0,0.2,1);
      height: 220px; /* 기본 상태: 약간 보임 */
      touch-action: none;
      will-change: height;
      overflow: hidden;
    }
    #sheet.expanded { height: 70vh; }
    #sheet.route-mode { height: 100px; }

    /* 드래그 핸들 */
    #sheet-handle {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 28px;
      cursor: grab;
      padding-top: 8px;
    }
    #sheet-handle::after {
      content: '';
      width: 40px; height: 4px;
      background: #ddd;
      border-radius: 2px;
    }
    #sheet-handle:active { cursor: grabbing; }

    /* 시트 헤더 */
    #sheet-header {
      flex-shrink: 0;
      padding: 0 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #count-label {
      font-size: 13px;
      color: #888;
      font-weight: 500;
    }
    #sheet-expand-btn {
      font-size: 12px;
      color: #03c75a;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* 목록 스크롤 영역 */
    #list-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .item {
      padding: 14px 18px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.12s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .item:active { background: #f5fff9; }
    .item.active { background: #e6faf0; border-left: 3px solid #03c75a; padding-left: 15px; }

    .item-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .item-icon.public  { background: #e8f0fe; }
    .item-icon.open    { background: #fdecea; }

    .item-body { flex: 1; min-width: 0; }
    .item-title { font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-addr  { font-size: 12px; color: #888; margin-bottom: 6px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge        { font-size:11px; padding:2px 8px; border-radius:10px; background:#e6faf0; color:#00994d; font-weight:600; }
    .badge.open   { background:#fff4e5; color:#e07000; }
    .badge.cctv   { background:#fdecea; color:#c0392b; }
    .badge.baby   { background:#eef3ff; color:#3b5bdb; }
    .badge.always { background:#e8f5e9; color:#2e7d32; }

    /* ── 경로 정보 (시트 안에 표시) ── */
    #route-info {
      display: none;
      padding: 16px 20px;
      align-items: center;
      gap: 16px;
      background: white;
    }
    #route-info.show { display: flex; }
    .ri-icon { font-size: 30px; }
    .ri-body { flex: 1; }
    .ri-title { font-size: 12px; color: #888; margin-bottom: 4px; }
    .ri-stats { display: flex; align-items: baseline; gap: 10px; }
    .ri-time { font-size: 26px; font-weight: 800; color: #03c75a; }
    .ri-dist { font-size: 15px; color: #888; }
    .ri-dest { font-size: 12px; color: #bbb; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── 인포윈도우 ── */
    .info-wrap  { padding:14px 16px; min-width:240px; max-width:300px; font-family:-apple-system,'Malgun Gothic',sans-serif; }
    .info-title { font-size:15px; font-weight:700; color:#111; margin-bottom:8px; padding-bottom:7px; border-bottom:1px solid #eee; }
    .info-row   { display:flex; gap:6px; font-size:12px; margin-bottom:5px; line-height:1.5; }
    .info-label { color:#aaa; min-width:52px; flex-shrink:0; }
    .info-val   { color:#333; }
    .info-badges { margin-top:8px; display:flex; gap:4px; flex-wrap:wrap; }
    .pbadge     { font-size:11px; padding:3px 8px; border-radius:10px; font-weight:600; }
    .nav-btn {
      margin-top: 12px; width: 100%; padding: 11px 0;
      background: #03c75a; color: white; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .nav-btn:active { background: #02a84a; }
    .nav-btn:disabled { background: #ccc; }

    /* FAB 위치 동적 조정 */
    #fabs { bottom: 230px; }
    #sheet.expanded ~ #fabs,
    body.sheet-expanded #fabs { bottom: calc(70vh + 12px); }

    /* 모바일에서만 route-mode */
    #sheet.route-mode #list-area { display: none; }
    #sheet.route-mode #sheet-header { display: none; }
    #sheet.route-mode #route-info { display: flex; }
  </style>
</head>
<body>

<!-- 전체화면 지도 -->
<div id="map"></div>

<!-- 상단 검색바 -->
<div id="top-bar">
  <div id="search-box">
    <span class="logo">🚻</span>
    <input type="text" id="search-input" placeholder="화장실명 또는 주소 검색" autocomplete="off">
    <button id="clear-btn" title="지우기">✕</button>
  </div>
  <div id="autocomplete"></div>
</div>

<!-- 경로 취소 -->
<button id="route-cancel-fab">✕ 경로 취소</button>

<!-- FAB 버튼 -->
<div id="fabs">
  <button class="fab" id="locate-btn" title="현재 위치">📍</button>
</div>

<!-- Bottom Sheet -->
<div id="sheet">
  <div id="sheet-handle"></div>
  <div id="sheet-header">
    <span id="count-label"></span>
    <button id="sheet-expand-btn">목록 더 보기 ▲</button>
  </div>

  <!-- 경로 정보 (경로 모드일 때만 보임) -->
  <div id="route-info">
    <div class="ri-icon">🚶</div>
    <div class="ri-body">
      <div class="ri-title">도보 이동 예상</div>
      <div class="ri-stats">
        <span class="ri-time" id="ri-time">--분</span>
        <span class="ri-dist" id="ri-dist">--m</span>
      </div>
      <div class="ri-dest" id="ri-dest"></div>
    </div>
  </div>

  <!-- 목록 -->
  <div id="list-area">
    <div id="list"></div>
  </div>
</div>

<script>
const data = [
  { name:"누상동체육시설 공중화장실", addr:"서울특별시 종로구 옥인6길 26-17", type:"공중화장실", manager:"종로구청 청소행정과", phone:"221482383", hours:"상시", hoursDetail:"", maleT:1, maleU:1, femaleT:1, cctv:"N", baby:"N", lat:37.58011, lng:126.96367 },
  { name:"종로문화체육센터", addr:"서울특별시 종로구 인왕산로1길 21", type:"개방화장실", manager:"종로구시설관리공단 건강사업부", phone:"27329393", hours:"정시", hoursDetail:"09:00~18:00", maleT:2, maleU:3, femaleT:7, cctv:"N", baby:"Y", lat:37.57428, lng:126.96468 },
  { name:"통인시장 고객만족센터", addr:"서울특별시 종로구 자하문로 15길 18", type:"공중화장실", manager:"통인시장 상인회", phone:"27220911", hours:"정시", hoursDetail:"11:00~16:00", maleT:2, maleU:3, femaleT:4, cctv:"N", baby:"Y", lat:37.58077, lng:126.96995 },
  { name:"보건소", addr:"서울특별시 종로구 자하문로19길 36", type:"개방화장실", manager:"종로보건소", phone:"221483520", hours:"정시", hoursDetail:"평일 09:00~18:00", maleT:7, maleU:7, femaleT:10, cctv:"N", baby:"N", lat:37.58177, lng:126.96926 },
  { name:"광장시장(합동,화창빌딩)", addr:"서울특별시 종로구 종로 194-7", type:"개방화장실", manager:"광장시장", phone:"", hours:"정시", hoursDetail:"07:00-18:00 (일요일 휴무)", maleT:2, maleU:2, femaleT:2, cctv:"N", baby:"N", lat:37.57042, lng:126.99938 },
  { name:"동대문역(4호선)", addr:"서울특별시 종로구 종로6가 287-1", type:"공중화장실", manager:"서울교통공사", phone:"261104211", hours:"정시", hoursDetail:"05:00~24:00", maleT:2, maleU:4, femaleT:4, cctv:"Y", baby:"N", lat:37.561159, lng:126.994398 },
  { name:"안국역(3호선)", addr:"서울특별시 종로구 안국동 155-2", type:"공중화장실", manager:"서울교통공사", phone:"261103281", hours:"정시", hoursDetail:"05:00~24:00", maleT:4, maleU:4, femaleT:4, cctv:"Y", baby:"Y", lat:37.566412, lng:126.994185 },
  { name:"동묘앞역(1호선)", addr:"서울특별시 종로구 숭인동 117", type:"공중화장실", manager:"서울교통공사", phone:"261101271", hours:"정시", hoursDetail:"05:00~24:00", maleT:1, maleU:2, femaleT:1, cctv:"Y", baby:"Y", lat:37.573281, lng:127.016649 },
  { name:"버거킹(종로점)", addr:"서울특별시 종로구 종로 94", type:"개방화장실", manager:"버거킹(종로점)", phone:"", hours:"정시", hoursDetail:"09:00-24:00", maleT:1, maleU:1, femaleT:4, cctv:"N", baby:"N", lat:37.56994, lng:126.98811 },
  { name:"인왕산 청운지구(청운공원 화장실)", addr:"서울특별시 종로구 청운동 7-3", type:"공중화장실", manager:"종로구청 도시녹지과", phone:"221482832", hours:"상시", hoursDetail:"", maleT:2, maleU:3, femaleT:5, cctv:"Y", baby:"N", lat:37.59103, lng:126.96627 },
  { name:"허리우드극장(낙원상가4층)", addr:"서울특별시 종로구 삼일대로 428", type:"개방화장실", manager:"허리우드극장", phone:"", hours:"정시", hoursDetail:"09:30-17:00", maleT:3, maleU:5, femaleT:9, cctv:"N", baby:"N", lat:37.57258, lng:126.98781 },
  { name:"종묘공영주차장", addr:"서울특별시 종로구 훈정동 2", type:"개방화장실", manager:"서울시설공단 주차시설운영처", phone:"222906114", hours:"정시", hoursDetail:"00:00~24:00", maleT:3, maleU:6, femaleT:3, cctv:"Y", baby:"N", lat:37.5715, lng:126.99505 },
  { name:"동대문지하상가 화장실", addr:"서울특별시 종로구 율곡로 지하 308", type:"개방화장실", manager:"서울시시설관리공단", phone:"222906545", hours:"정시", hoursDetail:"06:00~24:00", maleT:3, maleU:5, femaleT:8, cctv:"Y", baby:"N", lat:37.57616, lng:126.99479 }
];

// ── 지도 초기화 ──
const map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.575, 126.985),
  zoom: 14,
  mapTypeControl: false,
  zoomControl: false,
  logoControl: false,
  scaleControl: false
});

let infoWindow  = null;
let markers     = [];
let activeIdx   = null;
let myLocMarker = null;
let myLatLng    = null;
let routeLine   = null;

// ── 마커 아이콘 ──
function makeIcon(type, active) {
  const bg   = type === '공중화장실' ? (active ? '#0d47a1' : '#1a73e8') : (active ? '#b71c1c' : '#e53935');
  const size = active ? 40 : 34;
  return {
    content: `<div style="width:${size}px;height:${size}px;background:${bg};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:${active?17:14}px;line-height:1;">🚻</span></div>`,
    size: new naver.maps.Size(size, size),
    anchor: new naver.maps.Point(size/2, size)
  };
}

// ── 인포윈도우 HTML ──
function infoHTML(d, idx) {
  const badges = [];
  if (d.type==='공중화장실') badges.push(`<span class="pbadge" style="background:#e8f0fe;color:#1565c0;">공중화장실</span>`);
  else badges.push(`<span class="pbadge" style="background:#fdecea;color:#c62828;">개방화장실</span>`);
  if (d.hours==='상시') badges.push(`<span class="pbadge" style="background:#e8f5e9;color:#2e7d32;">24시간</span>`);
  if (d.cctv==='Y') badges.push(`<span class="pbadge" style="background:#fce4ec;color:#c62828;">📷 CCTV</span>`);
  if (d.baby==='Y') badges.push(`<span class="pbadge" style="background:#eef3ff;color:#3b5bdb;">👶 기저귀교환대</span>`);
  return `<div class="info-wrap">
    <div class="info-title">🚻 ${d.name}</div>
    <div class="info-row"><span class="info-label">📍 주소</span><span class="info-val">${d.addr}</span></div>
    <div class="info-row"><span class="info-label">🕐 운영</span><span class="info-val">${d.hours}${d.hoursDetail?' · '+d.hoursDetail:''}</span></div>
    <div class="info-row"><span class="info-label">🏢 관리</span><span class="info-val">${d.manager}</span></div>
    ${d.phone?`<div class="info-row"><span class="info-label">📞 전화</span><span class="info-val">${d.phone}</span></div>`:''}
    <div class="info-row"><span class="info-label">🚹 남성</span><span class="info-val">대변기 ${d.maleT}개 · 소변기 ${d.maleU}개</span></div>
    <div class="info-row"><span class="info-label">🚺 여성</span><span class="info-val">대변기 ${d.femaleT}개</span></div>
    <div class="info-badges">${badges.join('')}</div>
    <button class="nav-btn" onclick="startRoute(${idx})">🚶 이동하기</button>
  </div>`;
}

// ── 아이템 활성화 ──
function activateItem(i) {
  if (activeIdx !== null && activeIdx !== i) {
    markers[activeIdx].setIcon(makeIcon(data[activeIdx].type, false));
    document.querySelectorAll('.item')[activeIdx]?.classList.remove('active');
  }
  activeIdx = i;
  markers[i].setIcon(makeIcon(data[i].type, true));
  map.panTo(new naver.maps.LatLng(data[i].lat, data[i].lng));

  if (infoWindow) infoWindow.close();
  infoWindow = new naver.maps.InfoWindow({
    content: infoHTML(data[i], i),
    borderWidth: 0,
    disableAnchor: false,
    backgroundColor: 'white',
    borderColor: 'transparent',
    pixelOffset: new naver.maps.Point(0, -10)
  });
  infoWindow.open(map, markers[i]);

  const items = document.querySelectorAll('.item');
  items.forEach(el => el.classList.remove('active'));
  items[i]?.classList.add('active');
  items[i]?.scrollIntoView({ behavior:'smooth', block:'nearest' });

  // 시트 접기 (지도가 잘 보이도록)
  setSheetCollapsed();
}

// 마커 생성
data.forEach((d, i) => {
  const marker = new naver.maps.Marker({
    position: new naver.maps.LatLng(d.lat, d.lng),
    map,
    icon: makeIcon(d.type, false),
    title: d.name
  });
  markers.push(marker);
  naver.maps.Event.addListener(marker, 'click', () => activateItem(i));
});

// 지도 클릭 시 인포윈도우 닫기
naver.maps.Event.addListener(map, 'click', () => {
  if (infoWindow) infoWindow.close();
  if (activeIdx !== null) {
    markers[activeIdx].setIcon(makeIcon(data[activeIdx].type, false));
    document.querySelectorAll('.item')[activeIdx]?.classList.remove('active');
    activeIdx = null;
  }
  hideAutocomplete();
});

// ── Bottom Sheet 드래그 ──
const sheet = document.getElementById('sheet');
const handle = document.getElementById('sheet-handle');
const expandBtn = document.getElementById('sheet-expand-btn');
let sheetExpanded = false;

function setSheetExpanded() {
  sheetExpanded = true;
  sheet.classList.add('expanded');
  sheet.classList.remove('route-mode');
  expandBtn.textContent = '목록 접기 ▼';
  updateFabPosition();
}
function setSheetCollapsed() {
  sheetExpanded = false;
  sheet.classList.remove('expanded');
  sheet.classList.remove('route-mode');
  expandBtn.textContent = '목록 더 보기 ▲';
  updateFabPosition();
}
function setSheetRouteMode() {
  sheetExpanded = false;
  sheet.classList.remove('expanded');
  sheet.classList.add('route-mode');
  updateFabPosition();
}
function updateFabPosition() {
  const fabs = document.getElementById('fabs');
  if (sheetExpanded) {
    fabs.style.bottom = (window.innerHeight * 0.7 + 12) + 'px';
  } else {
    fabs.style.bottom = '242px';
  }
}

expandBtn.addEventListener('click', () => {
  if (sheetExpanded) setSheetCollapsed();
  else setSheetExpanded();
});

// 드래그로 시트 열기/닫기
let dragStartY = 0;
let dragStartH = 0;
let isDragging = false;

function onDragStart(y) {
  isDragging = true;
  dragStartY = y;
  dragStartH = sheet.offsetHeight;
  sheet.style.transition = 'none';
}
function onDragMove(y) {
  if (!isDragging) return;
  const dy = dragStartY - y;
  const newH = Math.max(80, Math.min(window.innerHeight * 0.85, dragStartH + dy));
  sheet.style.height = newH + 'px';
}
function onDragEnd(y) {
  if (!isDragging) return;
  isDragging = false;
  sheet.style.transition = '';
  sheet.style.height = '';
  const dy = dragStartY - y;
  if (dy > 40) setSheetExpanded();
  else if (dy < -40) setSheetCollapsed();
}

handle.addEventListener('touchstart', e => onDragStart(e.touches[0].clientY), { passive: true });
handle.addEventListener('touchmove', e => onDragMove(e.touches[0].clientY), { passive: true });
handle.addEventListener('touchend', e => onDragEnd(e.changedTouches[0].clientY));
handle.addEventListener('mousedown', e => { onDragStart(e.clientY); });
document.addEventListener('mousemove', e => { if (isDragging) onDragMove(e.clientY); });
document.addEventListener('mouseup', e => { if (isDragging) onDragEnd(e.clientY); });

// ── 현재 위치 ──
document.getElementById('locate-btn').addEventListener('click', () => {
  const btn = document.getElementById('locate-btn');
  if (!navigator.geolocation) { alert('이 브라우저는 위치 서비스를 지원하지 않습니다.'); return; }
  btn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove('loading');
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    myLatLng = new naver.maps.LatLng(lat, lng);
    if (myLocMarker) myLocMarker.setMap(null);
    myLocMarker = new naver.maps.Marker({
      position: myLatLng, map,
      icon: {
        content: `<div style="width:22px;height:22px;background:#1a73e8;border-radius:50%;border:3px solid white;box-shadow:0 0 0 5px rgba(26,115,232,0.25);"></div>`,
        size: new naver.maps.Size(22, 22),
        anchor: new naver.maps.Point(11, 11)
      },
      title: '현재 위치', zIndex: 200
    });
    map.setCenter(myLatLng);
    map.setZoom(16);
    setSheetCollapsed();
  }, () => {
    btn.classList.remove('loading');
    alert('위치를 가져올 수 없습니다. 브라우저 위치 권한을 허용해주세요.');
  }, { enableHighAccuracy: true, timeout: 10000 });
});

// ── 도보 경로 ──
async function startRoute(destIdx) {
  if (!myLatLng) {
    if (!navigator.geolocation) { alert('위치 서비스를 지원하지 않습니다.'); return; }
    const btn = document.querySelector('.nav-btn');
    if (btn) { btn.disabled = true; btn.textContent = '위치 가져오는 중...'; }
    navigator.geolocation.getCurrentPosition(pos => {
      myLatLng = new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
      if (myLocMarker) myLocMarker.setMap(null);
      myLocMarker = new naver.maps.Marker({
        position: myLatLng, map,
        icon: { content: `<div style="width:22px;height:22px;background:#1a73e8;border-radius:50%;border:3px solid white;box-shadow:0 0 0 5px rgba(26,115,232,0.25);"></div>`, size: new naver.maps.Size(22,22), anchor: new naver.maps.Point(11,11) },
        title: '현재 위치', zIndex: 200
      });
      drawRoute(destIdx);
    }, () => alert('위치 권한을 허용해주세요.'), { enableHighAccuracy: true, timeout: 10000 });
  } else {
    drawRoute(destIdx);
  }
}

async function drawRoute(destIdx) {
  const dest = data[destIdx];
  clearRoute();
  try {
    const url = `https://router.project-osrm.org/route/v1/foot/${myLatLng.lng()},${myLatLng.lat()};${dest.lng},${dest.lat}?overview=full&geometries=geojson`;
    const res  = await fetch(url);
    const json = await res.json();
    if (!json.routes?.length) { alert('경로를 찾을 수 없습니다.'); return; }

    const route   = json.routes[0];
    const distM   = Math.round(route.distance);
    const walkMin = Math.ceil(route.duration / 60);
    const coords  = route.geometry.coordinates.map(([lng, lat]) => new naver.maps.LatLng(lat, lng));

    routeLine = new naver.maps.Polyline({
      path: coords, map,
      strokeColor: '#1a73e8', strokeWeight: 5, strokeOpacity: 0.85,
      startIcon: naver.maps.PointingIcon.CIRCLE,
      endIcon: naver.maps.PointingIcon.BLOCK_ARROW
    });

    const bounds = coords.reduce((b, ll) => b.extend(ll), new naver.maps.LatLngBounds(coords[0], coords[0]));
    map.fitBounds(bounds, { top: 80, right: 40, bottom: 140, left: 40 });

    const distText = distM >= 1000 ? (distM/1000).toFixed(1) + 'km' : distM + 'm';
    document.getElementById('ri-time').textContent = walkMin + '분';
    document.getElementById('ri-dist').textContent = distText;
    document.getElementById('ri-dest').textContent = '목적지: ' + dest.name;
    document.getElementById('route-cancel-fab').classList.add('show');
    setSheetRouteMode();
    if (infoWindow) infoWindow.close();
  } catch (e) {
    alert('경로를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
  }
}

function clearRoute() {
  if (routeLine) { routeLine.setMap(null); routeLine = null; }
  document.getElementById('route-cancel-fab').classList.remove('show');
  setSheetCollapsed();
}

document.getElementById('route-cancel-fab').addEventListener('click', clearRoute);

// ── 검색 / 자동완성 ──
const input    = document.getElementById('search-input');
const acBox    = document.getElementById('autocomplete');
const clearBtn = document.getElementById('clear-btn');
let acSelected = -1;
let acFiltered = [];

function highlight(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+q.length) + '</mark>' + text.slice(idx+q.length);
}

function showAutocomplete(q) {
  acFiltered = q ? allItems.filter(({d}) =>
    d.name.toLowerCase().includes(q.toLowerCase()) || d.addr.toLowerCase().includes(q.toLowerCase())
  ).slice(0,6) : [];
  if (!acFiltered.length) { hideAutocomplete(); return; }
  acBox.innerHTML = acFiltered.map(({d},idx) => `
    <div class="ac-item" data-idx="${idx}">
      <span class="ac-name">${highlight(d.name,q)}</span>
      <span class="ac-addr">${highlight(d.addr,q)}</span>
    </div>`).join('');
  acBox.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('mousedown', e => { e.preventDefault(); selectAcItem(parseInt(el.dataset.idx)); });
    el.addEventListener('touchend', e => { e.preventDefault(); selectAcItem(parseInt(el.dataset.idx)); });
  });
  acSelected = -1;
  acBox.classList.add('show');
}

function hideAutocomplete() { acBox.classList.remove('show'); acSelected = -1; }

function selectAcItem(idx) {
  const {d, i} = acFiltered[idx];
  input.value = d.name;
  clearBtn.classList.add('visible');
  hideAutocomplete();
  applySearch(d.name);
  activateItem(i);
  input.blur();
}

function applySearch(q) {
  const filtered = q ? allItems.filter(({d}) =>
    d.name.toLowerCase().includes(q.toLowerCase()) || d.addr.toLowerCase().includes(q.toLowerCase())
  ) : allItems;
  allItems.forEach(({i}) => markers[i].setMap(map));
  allItems.filter(({i}) => !filtered.some(f => f.i === i)).forEach(({i}) => markers[i].setMap(null));
  renderList(filtered);
}

input.addEventListener('input', () => {
  const q = input.value;
  clearBtn.classList.toggle('visible', q.length > 0);
  showAutocomplete(q);
  applySearch(q);
  if (infoWindow) infoWindow.close();
  if (activeIdx !== null) {
    markers[activeIdx].setIcon(makeIcon(data[activeIdx].type, false));
    activeIdx = null;
  }
});

input.addEventListener('keydown', e => {
  const items = acBox.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acSelected = Math.min(acSelected+1, items.length-1); items.forEach((el,i) => el.classList.toggle('selected',i===acSelected)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acSelected = Math.max(acSelected-1,-1); items.forEach((el,i) => el.classList.toggle('selected',i===acSelected)); }
  else if (e.key === 'Enter') { if (acSelected>=0 && acFiltered[acSelected]) selectAcItem(acSelected); else hideAutocomplete(); }
  else if (e.key === 'Escape') { hideAutocomplete(); input.blur(); }
});

input.addEventListener('focus', () => {
  if (input.value) showAutocomplete(input.value);
});
input.addEventListener('blur', () => setTimeout(hideAutocomplete, 200));

clearBtn.addEventListener('click', () => {
  input.value = ''; clearBtn.classList.remove('visible');
  hideAutocomplete(); applySearch(''); renderList(allItems);
  if (infoWindow) infoWindow.close();
  if (activeIdx !== null) {
    markers[activeIdx].setIcon(makeIcon(data[activeIdx].type, false));
    activeIdx = null;
  }
  input.focus();
});

// ── 목록 렌더링 ──
function renderList(filtered) {
  const list = document.getElementById('list');
  document.getElementById('count-label').textContent = `총 ${filtered.length}개 화장실`;
  list.innerHTML = '';
  filtered.forEach(({d, i}) => {
    const el = document.createElement('div');
    el.className = 'item';
    const isPublic = d.type === '공중화장실';
    const badges = [];
    if (isPublic) badges.push(`<span class="badge">공중</span>`);
    else badges.push(`<span class="badge open">개방</span>`);
    if (d.hours==='상시') badges.push(`<span class="badge always">24시간</span>`);
    if (d.cctv==='Y') badges.push(`<span class="badge cctv">CCTV</span>`);
    if (d.baby==='Y') badges.push(`<span class="badge baby">기저귀교환대</span>`);
    el.innerHTML = `
      <div class="item-icon ${isPublic?'public':'open'}">🚻</div>
      <div class="item-body">
        <div class="item-title">${d.name}</div>
        <div class="item-addr">${d.addr}</div>
        <div class="item-badges">${badges.join('')}</div>
      </div>
    `;
    el.addEventListener('click', () => {
      activateItem(i);
      setSheetCollapsed();
    });
    list.appendChild(el);
  });
}

const allItems = data.map((d, i) => ({ d, i }));
renderList(allItems);
updateFabPosition();
</script>
